[tool.poetry]
name = "turismo-app"
version = "0.1.0"
description = "Plataforma de Reservas y Ofertas Turísticas"
authors = ["Tu Nombre <tu@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
reflex = "^0.6.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.36"
pyodbc = "^5.1.0"
python-dotenv = "^1.0.1"
httpx = "^0.28.0"
pydantic = "^2.9.0"
sqlmodel = "^0.0.21"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
black = "^24.10.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]
